# Monster matching filter
# [1] Center distance threshold filter : pixel_distance_filter [2] Non-Maximum Suppression filter : NMS

mob_filter_method:
  method : pixel_distance_filter

nms_threshold : 0.4   # (0-1) Higher number means stricter judgment; lower number merges overlapping boxes into one
pix_filter_threshold : 50  # (Pixels) Center distance threshold: monsters with center distance less than this are treated as afterimages/duplicates and filtered out
