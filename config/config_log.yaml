logging_setting:
  log_path:  "./log"
  log_file_name: "log.log" 
  # Log filtering level (adjust sensitivity as needed)
  # Parameter description:
  # - "DEBUG"    : Most detailed debug and scanning process (suitable for dev/testing)
  # - "INFO"     : General operation and status messages (recommended for daily use)
  # - "WARNING"  : Warning and error messages only (cleaner console)
  # - "ERROR"    : Critical error messages only
  log_level: "WARNING"
