game:
  # Window title for MapleStory (Change to your exact client title, e.g., "MapleStory" or "MapleStory Worlds")
  title: "FortySevenMS"

player_setting:
  # Potion threshold settings: key = keystroke, value = HP/MP percentage (0-100) below which potion triggers
  # Common keys: "delete", "pagedown", "pageup", "end", "home", "insert"
  health_setting:
    light:
      key: null
      value: 80
    medium:
      key: null
      value: 50
    critical:
      key: "delete"
      value: 20
  mp_setting:
    light:
      key: null
      value: 80
    medium:
      key: null
      value: 50
    critical:
      key: "pagedown"
      value: 20

  # Combat settings
  auto_control_config:
    # Jump-attack toggle (e.g. Night Lord / Assassin jump-shot): True = ON, False = OFF
    is_Night_Lord: False

    # AOE skill toggle: True = ON, False = OFF
    enable_AOE: True
    AOE_threshold: 3  # Trigger AOE when mob count in ROI >= this value

    # Character attack range in pixels. Reference: Melee: 100-150, Ranged: 200-500
    attack_range: 110

image_processing:
  # Template matching confidence thresholds (adjust if missing targets or getting false positives)
  mob_min_threshold: 0.95
  role_min_threshold: 0.7

game_bot:
  # ROI bounding box offsets from character center
  # Balance between CPU usage and mob detection coverage. Reference: Melee 100-200, Ranged 300-500
  roi_x_offset_l_width: 300
  roi_x_offset_r_width: 300
  roi_y_offset_t_high: 150
  roi_y_offset_b_high: 40

auto_control_config:
  # Mob search toggle: True/False
  TOGGLE_PATROL_ACTION: True

  # Combat action toggle: True/False
  TOGGLE_COMBAT_ACTION: True

  # Platform transition timeout in seconds: if no mob is found within this time, transition platforms
  find_mob_time_threshold: 15

  # Unstuck check interval in seconds: triggers unstuck action if stationary during patrol
  stuck_check_time_threshold: 2

  # Platform boundary buffer in pixels: character turns around when within buffer distance from platform edge
  buffer: 3

# Minimap crop offset relative to the game window client area (top-left corner)
minimap:
  crop_offset: [6, 72]  # [x1, y1] relative to client area

health_detector:
  # Health/Mana bar pixel coordinates [x1, y1, x2, y2]
  # NOTE: Resolution and DPI affect these coordinates. Recalibrate if bar position differs.
  hp_bar_loc: [475, 750, 631, 760]
  mp_bar_loc: [643, 750, 799, 760]

  # HP bar color HSV bounds (Red)
  lower_hp_color: [0, 200, 200]
  upper_hp_color: [5, 255, 255]

  # MP bar color HSV bounds (Blue)
  lower_mp_color: [100, 132, 90]
  upper_mp_color: [107, 255, 255]

keyboard:
  # Keybindings (test key names with tools/keyboard_check.py)
  left: left
  right: right
  up: up
  down: down
  attack: z
  aoe_attack: z
  pick_up: n
  jump: alt

folder_path:
  template_nametag_path: img/nametag/example2.png # Template used by nametag capture tool
  my_character_template_path: img/nametag/MyRoleNameTag.png  # Active character nametag template
